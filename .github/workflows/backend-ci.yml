name: Backend CI

on:
  push:
    branches: [main]
    paths: ["app/**", "database/**", "tests/**", "requirements*.txt", "Dockerfile", "gunicorn.conf.py", "wsgi.py", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["app/**", "database/**", "tests/**", "requirements*.txt", "Dockerfile", "gunicorn.conf.py", "wsgi.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install system packages (Poppler for PDF tests, GL for OpenCV)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils libgl1

      - name: Install dependencies
        run: pip install -r requirements-dev.txt && pip check

      - name: Import every backend module
        run: |
          python - <<'EOF'
          import importlib, pkgutil, app, wsgi
          failures = []
          for m in pkgutil.walk_packages(app.__path__, "app."):
              try:
                  importlib.import_module(m.name)
              except Exception as e:
                  failures.append(f"{m.name}: {e!r}")
          assert not failures, "\n".join(failures)
          print("all modules import")
          EOF

      - name: Migration graph has a single head
        run: |
          heads=$(FLASK_APP=wsgi.py DATABASE_URL=sqlite:///:memory: flask db heads | wc -l)
          test "$heads" -eq 1

      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t cuestic-api:ci .
      - name: Image contains pdftoppm and no secrets
        run: |
          docker run --rm --entrypoint sh cuestic-api:ci -c '
            command -v pdftoppm
            found=$(find /app \( -name ".env" -o -name "*adminsdk*" -o -name "*.db" \) | wc -l)
            test "$found" -eq 0'
