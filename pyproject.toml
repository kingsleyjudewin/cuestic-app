[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cuestic-vp-app"
version = "1.0.0"
description = "Departmental Club Task Assignment Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Migrate>=4.0.0",
    "Flask-Cors>=4.0.0",
    "Flask-Limiter>=3.5.0",
    "marshmallow>=3.20.0",
    "phonenumbers>=8.13.0",
    "python-dotenv>=1.0.0",
    "APScheduler>=3.10.0",
    "flasgger>=0.9.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"
